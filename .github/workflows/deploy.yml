# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

# Needed by the official Pages actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push replaces an older one that is still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # .npmrc sets legacy-peer-deps (npm 10 crashes on vitest 4 peers without it)
      - run: npm ci
      # The site is only published if lint, tests and the build all pass.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
